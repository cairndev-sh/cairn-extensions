# Tag-driven publishing to PyPI, the core's shape (cairndev-sh/cairn release.yml) with the
# cadence ADR-0128 D3 sets for this repository: each distribution releases on its own tag,
# `<distribution>/vX.Y.Z`, and there is no repository-wide version. RELEASING.md has the steps.
#
#   push a tag `<distribution>/vX.Y.Z`   build every distribution, test the built wheels on the
#                                        released cairndev, then publish that one distribution
#                                        after the `pypi` environment's approval
#   workflow_dispatch, publish: false    the same checks and builds, and what would be uploaded;
#                                        nothing is published (the dry run)
#   workflow_dispatch, publish: true     only from a release tag (`Use workflow from` the tag):
#                                        reruns that tag's release
#
# Trusted publishing (OIDC) only: no API token is read anywhere. A file PyPI already holds is
# skipped, never uploaded again, so a rerun is safe.
name: release
'on':
  push:
    tags:
    - '*/v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (needs a release tag ref; false is a dry run)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      distribution: ${{ steps.plan.outputs.distribution }}
      version: ${{ steps.plan.outputs.version }}
      files: ${{ steps.plan.outputs.files }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0   # every tag and main: the version-bump check diffs against each distribution's last tag
    - uses: astral-sh/setup-uv@v7
      with:
        version: 0.11.9
    - name: Publish or dry run
      id: mode
      env:
        EVENT: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        PUBLISH_INPUT: ${{ inputs.publish }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = push ]; then
          publish=true
        elif [ "$PUBLISH_INPUT" = true ]; then
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::publish: true runs from a release tag (<distribution>/vX.Y.Z); this run is on a branch. Use publish: false for a dry run."
            exit 1
          fi
          publish=true
        else
          publish=false
        fi
        echo "publish=$publish" >> "$GITHUB_OUTPUT"
        echo "publish: $publish"
    - name: Release plan (the tag names a distribution at its version; every changed distribution bumped its version)
      id: plan
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: |
        set -euo pipefail
        args=(plan --github-output "$GITHUB_OUTPUT")
        if [ -n "$TAG" ]; then args+=(--tag "$TAG" --main origin/main); fi
        python3 scripts/release.py "${args[@]}"
    - name: Build every distribution (sdist and wheel)
      run: |
        set -euo pipefail
        mkdir -p dist
        members="$(python3 scripts/members.py)"   # fails on a member that cannot build
        for d in $members; do uv build -q "$d" -o dist; done
        ls -l dist
    - name: Test the built wheels on the released cairndev
      env:
        UV_PYTHON: '3.13'
      run: scripts/test_wheels.sh --wheels dist
    - name: What would be uploaded (asks PyPI which files it already holds)
      env:
        SELECTED: ${{ steps.plan.outputs.distributions }}
      run: |
        set -euo pipefail
        args=(select --dist-dir dist --out "$RUNNER_TEMP/would-upload")
        for d in $SELECTED; do args+=(--distribution "$d"); done
        python3 scripts/release.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.distribution }}/${{ needs.build.outputs.version }}/
    permissions:
      contents: write   # the GitHub Release
      id-token: write   # PyPI trusted publishing
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Select the tagged distribution's files PyPI does not hold yet
      id: select
      env:
        DIST: ${{ needs.build.outputs.distribution }}
      run: python3 scripts/release.py select --dist-dir dist --out upload --distribution "$DIST" --github-output "$GITHUB_OUTPUT"
    - name: Publish to PyPI (trusted publishing)
      if: steps.select.outputs.upload == 'true'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: upload/
    - name: GitHub Release with the distribution's files
      uses: softprops/action-gh-release@v3
      with:
        files: dist/${{ needs.build.outputs.files }}
        fail_on_unmatched_files: true
        generate_release_notes: true
