# The extensions repository's CI (ADR-0128 D3 on GitHub Actions, as the core: ADR-0132 D8).
# Every wheel is proven against the RELEASED cairndev its own pins select, never a checkout.
name: ci
'on':
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        version: 0.11.9
    - name: Nothing private in the tree (imports, text, and the private tokens held in a secret)
      env:
        LEAK_SCAN_PRIVATE_TOKENS: ${{ secrets.LEAK_SCAN_PRIVATE_TOKENS }}
        # a pull request from a fork gets no secrets: the check is required everywhere else
        REQUIRE: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '--require-private-tokens' || '' }}
      run: python3 scripts/check_leaks.py $REQUIRE
    - name: Lint (the correctness rules, pyproject.toml [tool.ruff.lint])
      run: uvx ruff check .
    - name: The policy scripts' own tests
      run: uvx --python 3.13 --with pytest-asyncio pytest tests/test_check_leaks.py tests/test_check_venv.py tests/test_members.py tests/test_release.py -q -p no:cacheprovider
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        version: 0.11.9
    - name: Every wheel on the released core
      run: scripts/test_wheels.sh
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        version: 0.11.9
    - name: Build every wheel
      run: |
        set -euo pipefail
        mkdir -p dist
        members="$(python3 scripts/members.py)"   # fails on a member that cannot build
        for d in $members; do uv build -q "$d" -o dist; done
        ls -l dist
  demo-laptop:
    # The laptop demo end to end: install, then prepare -> LoRA -> held-out loss -> gates -> promote,
    # on a tiny model built offline (no Hub access, no secrets). On the CPU: the hosted macOS runners
    # are VMs whose MPS device cannot allocate memory ("MPS backend out of memory" on a 256-byte
    # allocation, with or without PYTORCH_MPS_HIGH_WATERMARK_RATIO), so the Apple-silicon path is
    # not testable there; the CPU path is the same pipeline, profile and operators.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        version: 0.11.9
    - name: Install the demo
      run: demos/laptop/install.sh
    - name: Run it (answering the human gates as dev)
      run: demos/laptop/run.sh --tiny --auto-approve
      env:
        LAPTOP_DEMO_LOG_LINES: "300"
