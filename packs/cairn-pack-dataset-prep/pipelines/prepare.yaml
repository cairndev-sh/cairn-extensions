# pipelines/prepare.yaml — prepare a dataset once (cairn-extensions#16).
#
#   source-ok ⏸ → prepare (data flow) → data-review ⏸ (only when cleaning dropped a lot)
#     → format → data gate
#
# `source-ok` is a person confirming the source, its pin and the name before anything is
# written. `prepare` runs flows/prepare.yaml as one governed leg and, when it lands, the control plane
# registers `<register>-train`, `-val` and `-test` with roles training, validation and test,
# stamps each with its intake verdict, and registers the manifest (a report). `data-review` is a
# person looking at the numbers when either dedup pass dropped more than `review_drop_ratio` of
# what it read (cairn-extensions#39); otherwise it is routed off and nothing waits. `format` checks
# the cleaned corpus's example structure against the trainers it must feed. `data-ok` stops
# the pipeline (fail-closed) when a version came back blocked or invalid, or any example is
# malformed. The versions stay registered (the registry is append-only); a launch that names
# a blocked or invalid one is refused by the core's intake door either way, and the fine-tune
# pack's admission checks each version's role and verdict.
#
# The versions need the s3 store (`store: s3`, or a profile with `artifact_store = "s3"` and
# CAIRN_ARTIFACT_S3_BUCKET): the split refuses to register from the local store, whose files sit
# in the leg's temporary workdir, are deleted at a reboot, and cannot be read from another
# machine (the `format` leg, the holdout door, a trainer on a GPU box).
#
# Nothing here writes row content into the record: stats, hashes, counts and version ids.
name: prepare
kind: pipeline
visibility: public
description: >
  Pin a dataset source, drop duplicates, profile prompt+response lengths and topics, split it
  by group into train / val / test and register the three versions with their roles.
outcome: Turn a raw dataset into frozen train, val and test versions
suite: data

inputs:
  # `$inherit: prepare` wires every input below into the `prepare` leg by name (ADR-0106 D2);
  # the specs stay because a `kind: data` flow declares only placeholder names.
  $inherit: prepare
  path: {type: str, description: "A Hugging Face dataset id, a local JSONL/CSV/Parquet file or an s3:// object."}
  revision: {type: str, default: "", description: "Hub commit, tag or branch to load the source at; a commit sha is the only pin that cannot move. Ignored for a file."}
  register: {type: str, description: "Dataset name prefix: versions <register>-train, -val and -test are registered."}
  seed: {type: int, default: 13, description: "Split seed; the same corpus and seed give the same three versions."}
  train_ratio: {type: float, default: 0.9}
  val_ratio: {type: float, default: 0.05}
  test_ratio: {type: float, default: 0.05}
  group_by: {type: str, default: "", description: "Row field no group may straddle (a template family); empty = every row its own group."}
  derive:
    type: list
    default: []
    description: "fields.derive rules: [{field, source, mode: extract | normalize, pattern, replace, default, case}]."
  topic_fields: {type: list, default: [], description: "Label fields counted by value in the audit (top 20)."}
  group_fields: {type: list, default: [], description: "Grouping fields reported by size only (their values are prompt text)."}
  near_dup_threshold: {type: float, default: 0.8, description: "Jaccard similarity above which two examples are near duplicates."}
  base_model: {type: str, default: "", description: "The model to be trained; its tokenizer counts the lengths (whitespace words without one, said in the report)."}
  max_seq_len: {type: int, default: 0, description: "Training sequence length; longer examples are counted (0 = no limit)."}
  over_length: {type: str, default: "count", description: "count | drop | refuse for examples over max_seq_len. Never truncate."}
  store: {type: str, default: "", description: "s3 or local for the exported files; empty = the environment's artifact store. Registering the versions needs s3."}
  # Not a flow key, so `$inherit` does not wire it into the leg: only `data-review` reads it.
  review_drop_ratio:
    type: float
    default: 0.30
    description: "Pause at data-review when exact or near dedup drops more than this share of the rows it read (0.30 = 30%); 1.0 never pauses."

governance:
  budget: {usd: 1}
  series: dataset-prep
  approvers: data-owners

steps:
  # The PERSON gate before anything is written: the versions this run registers are frozen
  # under `register`, so someone confirms what is being read, at which pin, and under what name.
  - gate: source-ok
    approvers: data-owners
    show:
      - input.path
      - input.revision
      - input.register
      - input.group_by
      - input.test_ratio

  - id: prepare
    label: Pin, audit, split and register
    flow: prepare
    depends_on: [source-ok]
    timeout: 60m

  # The REVIEW gate (cairn-extensions#39): a person, only when cleaning removed a large share of
  # the source. In the first qualification run near dedup dropped 36,385 of 42,680 rows (85%) and
  # nobody saw the number before training. `when:` is plain JMESPath and cannot divide, so each
  # dedup pass reports `dropped_fraction` (dropped / the rows that pass read) and this compares
  # each with `review_drop_ratio`. Near dedup's share is of what exact dedup kept, so two passes
  # just under the limit can together drop more than it; each is shown below.
  #
  # Written as "not (both within the limit)" so it fails closed: a missing stat (an older
  # cairn-operator-dataset-checks) routes the gate IN, never off. A limit that is not a number is
  # refused at the launch door (the input is declared float).
  #
  # `show:` reads the prepare leg's findings only: cairndev 0.3.1 resolves `show:` refs against
  # step outputs, so `input.near_dup_threshold` would read None (cairndev-sh/cairn#236).
  # `dedup_near_threshold` is the threshold the near pass applied; with `dedup_near_method`
  # `skipped` (no [minhash] extra) there is none.
  #
  # Approving (`cairn remote advance <pipeline-id> data-review`) lets the run go on to `format`
  # and `data-ok`. A pipeline gate has no reject door in cairndev 0.3.1: to decline, cancel the
  # pipeline (`cairn remote cancel-pipeline <pipeline-id>`), which ends it and records the open
  # review as rejected. Either way the three versions are already registered (the leg registers
  # them when it lands): declining does not mark them, and the fine-tune pack's launch door still
  # admits them. Do not train on a declined run's versions; re-run with another threshold
  # instead. Marking them when the review is declined is follow-up work.
  - gate: data-review
    depends_on: [prepare]
    when: >-
      !(steps.prepare.findings.dedup_exact_dropped_fraction <= input.review_drop_ratio &&
      steps.prepare.findings.dedup_near_dropped_fraction <= input.review_drop_ratio)
    approvers: data-owners
    show:
      - prepare.ingest_normalize_rows
      - prepare.dedup_exact_dropped
      - prepare.dedup_exact_dropped_fraction
      - prepare.dedup_near_dropped_near
      - prepare.dedup_near_dropped_fraction
      - prepare.dedup_near_threshold
      - prepare.dedup_near_method
      - prepare.export_jsonl_rows
      - prepare.profile_tokens_tokens_total
      - prepare.profile_tokens_tokens_p95
      - prepare.profile_tokens_over_length_rows
      - prepare.split_rows_train
      - prepare.split_rows_val
      - prepare.split_rows_test

  - id: format
    label: Check the example structure
    task: dataset/format
    depends_on: [data-review]
    with:
      path: $steps.prepare.export_jsonl_output
      target_trainers: [trl, unsloth]

  # The DATA gate: answered by the data. `intake_verdicts` holds `<name>@<v>=<verdict>` for
  # every version the leg registered (ADR-0102 D1).
  - gate: data-ok
    depends_on: [format]
    predicate: >-
      steps.format.conformant == steps.format.total &&
      length(steps.prepare.findings.intake_verdicts[?contains(@, '=blocked') || contains(@, '=invalid_format')]) == `0`

outputs:
  versions: prepare.dataset_versions
  verdicts: prepare.intake_verdicts
  manifest: prepare.dataset_manifest_output
  rows_in: prepare.ingest_normalize_rows
  exact_duplicates: prepare.dedup_exact_dropped
  near_duplicates: prepare.dedup_near_dropped_near
  exact_dropped_fraction: prepare.dedup_exact_dropped_fraction
  near_dropped_fraction: prepare.dedup_near_dropped_fraction
  tokens_p95: prepare.profile_tokens_tokens_p95
  over_length_rows: prepare.profile_tokens_over_length_rows
  topics: prepare.profile_fields_topic_values
  topic_counts: prepare.profile_fields_topic_counts
  format: format.detected_format
