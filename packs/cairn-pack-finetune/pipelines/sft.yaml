# pipelines/sft.yaml — fine-tune on prepared dataset versions (cairn-extensions#7).
#
#   approve-run ⏸ → acquire → smoke (ml) → smoke-ok → train (ml) → eval (ml) → release-box
#     → improved → promote-model ⏸ → promote ⏸            finally: release (on every outcome)
#
# Prepared data only: `train_version`, `val_version` and `test_version` are registered `dataset:`
# refs, as `dataset-prep/prepare` registers them. Nothing here re-audits or re-splits. The launch
# door decides the admission before any record exists:
#   * each version has the role its input declares (ADR-0146): a test set given as training data,
#     or a path instead of a registered version, refuses the launch;
#   * the train and val versions carry an intake verdict, and none is blocked or invalid;
#   * the holdout check: training data that meets a registered test or golden version refuses it;
#   * the base model's licence.
# The decision is on the pipeline record and on the first gate's card.
#
#   * `approve-run` — a person reads the admission and the GPU estimate (`estimate_usd`,
#     `estimate_basis` in the gate's evidence) before GPU time is spent. The `input.*` fields under
#     `show:` read empty under cairndev 0.3.1 (cairndev-sh/cairn#236); the launched inputs are on the
#     pipeline record.
#   * `acquire` — `compute/acquire` starts the EC2 instance `compute_connection` names, after the
#     approval: it stamps the `cairn:managed` / `cairn:release-after` lease first, then starts the
#     box and waits for SSH (ADR-0151 D8, D11).
#   * `smoke` — the same flow on a recorded subsample for a few steps: the whole path (data,
#     tokenizer, trainer, packaging) proved cheaply before the full run.
#   * `train` — the full run. The trainer evaluates on `val_version` at the end twice: the candidate
#     (`eval_loss`) and, with the adapter switched off, the base model (`baseline_eval_loss`).
#   * `eval` — the `sft-eval` flow on the same box (cairn-extensions#42): lm-evaluation-harness
#     (`eval_preset`) for the base model and for the base model plus the new adapter, with
#     identical settings, and both models' loss on `val_version` and `test_version` by one named
#     method. A time probe refuses the leg up front when the run would not fit its timeout.
#   * `release-box` — `compute/release` stops the box as soon as the last GPU leg (`eval`) is done,
#     so it does not bill while a person decides on promotion (ADR-0151 D11).
#   * `improved` — the candidate's validation loss must be below the base model's.
#   * `promote-model` — a person decides, with the losses and the evaluation's deltas on the card
#     (shown, not gated: a predicate on the deltas comes once real runs have sized the noise).
#   * `promote` — the `<tag>` points at the packaged adapter; `artifact/promote` asks for its own
#     approval as well.
#   * `release` — the same `compute/release` as a `finalizer:`: it runs once the pipeline is done,
#     failed or cancelled, whatever the chain above reached. It is idempotent (a stopped box is a
#     success). On a cancel, the engine job of a running `smoke` / `train` / `eval` leg on the box
#     is cancelled before this release stops the box (ADR-0151 D9).
#
# The box: `compute_connection` names the `compute.ssh` connection acquire starts and release
# stops, and it MUST be the connection the environment's `ml_target` selects (`gpu` in the
# `finetune-ssh` profile, this input's default). cairndev does not check that the two match yet
# (cairndev-sh/cairn#216): `cairn pipeline explain finetune/sft` prints both. With a mismatch, acquire starts one box, the
# ml legs run on another, and a cancel does not stop the job on the box the legs ran on.
#
# A box cairn does not start and stop (your own SSH box, any provider) or one machine:
# `finetune/sft-own-box` is this pipeline without `acquire`, `release-box` and `release`.
#
# `test_version` is never trained on; the `eval` leg measures both models' loss on it once. Not
# yet: a generation-quality evaluation (generated answers scored, base vs candidate:
# cairn-extensions#41). The verdict is still validation loss against the base model's; the
# benchmark deltas are on the `promote-model` card for the person who decides.
name: sft
kind: pipeline
visibility: public
description: >
  Fine-tune a base model with LoRA or QLoRA on prepared train / val / test versions: a smoke
  run, the full run with the base model's validation loss as the baseline, a person's decision,
  and a governed tag on the adapter.
outcome: Fine-tune a model on prepared data and decide whether to keep it
suite: model

inputs:
  # ADR-0146 — each version must have the role its input names, and a training version must carry
  # an intake verdict; the launch door refuses anything else before a record exists.
  train_version: {type: str, role: training, verdict: required, description: "dataset:<name>-train@<v> — the registered training version."}
  val_version: {type: str, role: validation, verdict: required, description: "dataset:<name>-val@<v> — the registered validation version."}
  test_version: {type: str, role: test, description: "dataset:<name>-test@<v> — the registered test version; never trained on, its loss measured once by the eval leg."}
  base_model: {type: str, default: "Qwen/Qwen3-4B-Base", description: "Hugging Face model id to adapt."}
  accept_license: {type: bool, default: false, description: "Required true when base_model is a gated catalog entry."}
  method: {type: str, default: "qlora", description: "qlora (4-bit) or lora."}
  output_name: {type: str, default: "sft-candidate", description: "The adapter's name, and its directory under the leg's workdir on the box (train-output/<output_name>). A retry of the same run resumes from its own checkpoints in CAIRN_CHECKPOINT_BUCKET; another run never does."}
  smoke_output_name: {type: str, default: "sft-smoke", description: "The smoke run's adapter name (its own directory)."}
  tag: {type: str, default: "sft-adapter@candidate", description: "The governed tag promote points at the adapter."}
  epochs: {type: float, default: 1.0}
  max_steps: {type: int, default: 0, description: "Optimizer steps for the full run; 0 = run the epochs."}
  learning_rate: {type: float, default: 0.0002}
  lora_r: {type: int, default: 16}
  lora_alpha: {type: int, default: 32}
  lora_dropout: {type: float, default: 0.0}
  target_modules: {type: str, default: "", description: "Comma-separated LoRA targets; empty = the trainer's default."}
  max_seq_len: {type: int, default: 2048}
  seed: {type: int, default: 3407}
  per_device_batch_size: {type: int, default: 0, description: "0 = the trainer's default."}
  gradient_accumulation_steps: {type: int, default: 0, description: "0 = the trainer's default."}
  gradient_checkpointing: {type: bool, default: true}
  packing: {type: bool, default: false, description: "Pack short rows into full sequences; off by default so every example is one sequence."}
  eval_steps: {type: int, default: 50}
  save_steps: {type: int, default: 50}
  save_total_limit: {type: int, default: 2}
  max_eval_loss: {type: float, default: 0, description: "Fail the full run fast when its final validation loss is above this (0 = no ceiling)."}
  smoke_rows: {type: int, default: 64, description: "Rows of the train version the smoke run trains on."}
  smoke_steps: {type: int, default: 5, description: "Optimizer steps of the smoke run."}
  report_to: {type: list, default: [], description: "Experiment trackers, e.g. [mlflow]; the tracker URI comes from the environment."}
  tracking_project: {type: str, default: "sft"}
  artifact_target: {type: str, default: "local", description: "Where the adapter is kept: local (the machine the ml leg ran on — on an ssh box, out of the control plane's reach), s3 (CAIRN_CHECKPOINT_BUCKET) or hf."}
  registered_model_name: {type: str, default: "", description: "MLflow Registered Model to add the adapter to (empty = none)."}
  stub: {type: bool, default: false, description: "Run the hermetic stub trainer and stub evaluation (no GPU): proves the pipeline, trains and measures nothing."}
  # cairn-extensions#42 — the `eval` leg.
  eval_preset: {type: str, default: "forgetting", description: "cairn-operator-eval-lm task preset the eval leg runs for the base model and the candidate (forgetting: five tasks at 500 documents and MMLU at 10 per subject)."}
  eval_seed: {type: int, default: 1234, description: "lm-eval's seeds for both models."}
  # ADR-0151 D11 — the box acquire starts and release stops. Must equal the environment's
  # `ml_target` (not checked by cairndev yet: cairndev-sh/cairn#216); its `instance_id`, `region` and `hourly_usd` are the connection's settings.
  compute_connection: {type: str, default: "gpu", description: "The compute.ssh connection to start after approve-run and stop after eval; must be the environment's ml_target (finetune-ssh: gpu)."}

governance:
  # #27, #42 — sized to the priced legs' worst case: on a connection with `hourly_usd`, the launch
  # door checks hourly_usd × timeout × attempts for each ml leg, (30m + 12h + 3h) × 2 attempts = 31
  # box-hours, $20.46 at the example rate of $0.66/h. A box dearer than $0.80/h needs a larger
  # budget, or a copy of this pipeline with shorter timeouts.
  budget: {usd: 25}
  series: sft
  approvers: ml-owners

steps:
  # ── the PERSON gate before any GPU time ───────────────────────────────────
  - gate: approve-run
    approvers: ml-owners
    show:
      - input.train_version
      - input.val_version
      - input.test_version
      - input.base_model
      - input.method
      - input.max_steps
      - input.compute_connection
    # The GPU estimate is not a `show:` field: this is the gate before the first priced leg, so
    # cairndev puts `estimate_usd` and `estimate_basis` in its evidence (ADR-0151 D4).

  # ── start the box, after the approval (ADR-0151 D11) ──────────────────────
  # `paid_compute`: under a profile that gates paid compute it pauses for its own approval too.
  # `max_hours` is the lease `cairn compute sweep --apply` enforces if the control plane dies. It
  # covers the retried worst case, 2 attempts × (30m + 12h + 3h) = 31h, plus a one-hour margin, so
  # a sweep never stops the box under a retried `train` or `eval`. The trade-off: a box orphaned by
  # a dead control plane can bill until the lease expires and a sweep stops it (32h, $21.12 at
  # $0.66/h).
  # A box acquire cannot start (no `instance_id` on the connection) fails this leg, and the
  # finalizer still runs.
  - id: acquire
    label: Start the GPU box
    task: compute/acquire
    depends_on: [approve-run]
    with:
      connection: $input.compute_connection
      max_hours: 32

  # ── smoke: the whole path on a subsample, a few steps ─────────────────────
  - id: smoke
    label: Smoke run on a subsample
    flow: sft-train
    depends_on: [acquire]
    timeout: 30m
    with: &run
      # #28 — an ml leg gets ONE attempt unless it declares more. Two: an attempt whose process
      # died without writing its exit code (the OOM killer, a kill on the box), which the engine
      # reports as retriable, runs once more, under the same run, and the trainer resumes
      # from that run's checkpoints in CAIRN_CHECKPOINT_BUCKET. A leg that fails on its own error
      # (a clean non-zero exit) is never retried. Each attempt reserves its own budget estimate;
      # on a priced box the launch estimate of the leg is hourly_usd × timeout × 2 (cairndev 0.3.1).
      retry: {max_attempts: 2}
      train_uri: $input.train_version
      eval_uri: $input.val_version
      test_uri: $input.test_version
      base_model: $input.base_model
      method: $input.method
      epochs: $input.epochs
      learning_rate: $input.learning_rate
      lora_r: $input.lora_r
      lora_alpha: $input.lora_alpha
      lora_dropout: $input.lora_dropout
      target_modules: $input.target_modules
      max_seq_len: $input.max_seq_len
      seed: $input.seed
      per_device_batch_size: $input.per_device_batch_size
      gradient_accumulation_steps: $input.gradient_accumulation_steps
      gradient_checkpointing: $input.gradient_checkpointing
      packing: $input.packing
      eval_steps: $input.eval_steps
      save_steps: $input.save_steps
      save_total_limit: $input.save_total_limit
      report_to: $input.report_to
      tracking_project: $input.tracking_project
      artifact_target: $input.artifact_target
      stub: $input.stub
      fidelity_rows: $input.smoke_rows
      max_steps: $input.smoke_steps
      # Its own adapter name: the full run must never resume from the smoke run's checkpoints
      # (it would carry the smoke steps). Each leg is its own run with its
      # own workdir and checkpoint key, so the name keeps the two adapters apart on the record.
      output_name: $input.smoke_output_name

  - gate: smoke-ok
    depends_on: [smoke]
    # A failed trainer already fails the leg; this checks the path ended in a packaged adapter.
    predicate: steps.smoke.findings.package_adapter_packaged == `true` && length(steps.smoke.findings.train_qlora_adapter_uri) > `0`

  # ── the full run, with the base model's validation loss as the baseline ───
  - id: train
    label: Fine-tune
    flow: sft-train
    depends_on: [smoke-ok]
    timeout: 12h
    with:
      <<: *run
      retry: {max_attempts: 2}   # as smoke's (#28), stated here because this is the 12-hour leg
      output_name: $input.output_name
      fidelity_rows: 0
      max_steps: $input.max_steps
      baseline_eval: true
      max_eval_loss: $input.max_eval_loss
      registered_model_name: $input.registered_model_name

  # ── base vs candidate, on the same box, before it stops (cairn-extensions#42) ──
  # The `sft-eval` flow: the base model loaded once (4-bit for qlora), scored with lm-evaluation-
  # harness, the new adapter attached to the same weights, scored again with the same tasks,
  # documents, few-shot count, batch size and seeds; then both models' loss on the val and test
  # versions by one method (`eval_lm_eval_split_loss_method` on the record). The adapter is the
  # train leg's directory on this box, or its published `adapter_uri` when that is gone.
  # A time probe scores about 50 documents first and refuses the leg (a clean failure, not retried)
  # when the projection does not fit `time_budget_s`, which must equal `timeout` in seconds. A
  # harness that is missing or fails on the box is not a failure: the leg reports `checked: false`
  # with the reason and the card shows it. A killed attempt is retried once and starts again.
  - id: eval
    label: Benchmarks and held-out loss, base and candidate
    flow: sft-eval
    depends_on: [train]
    timeout: 3h
    with:
      retry: {max_attempts: 2}
      base_model: $input.base_model
      method: $input.method
      local_adapter_dir: $steps.train.train_qlora_local_adapter_dir
      adapter_uri: $steps.train.train_qlora_adapter_uri
      val_uri: $input.val_version
      test_uri: $input.test_version
      preset: $input.eval_preset
      seed: $input.eval_seed
      max_seq_len: $input.max_seq_len
      time_budget_s: 10800
      stub: $input.stub

  # ── stop the box: the last GPU leg is done (ADR-0151 D11) ─────────────────
  # Before any person decides on promotion, so the box does not bill while it waits.
  - id: release-box
    label: Stop the GPU box
    task: compute/release
    depends_on: [train, eval]
    with:
      connection: $input.compute_connection

  # ── the verdict: better than the model it started from, on the same rows ──
  - gate: improved
    depends_on: [train, eval, release-box]
    predicate: steps.train.findings.train_qlora_eval_loss < steps.train.findings.train_qlora_baseline_eval_loss

  # ── the PERSON gate on the model ──────────────────────────────────────────
  - gate: promote-model
    depends_on: [improved]
    approvers: ml-owners
    show:
      - train.train_qlora_baseline_eval_loss
      - train.train_qlora_eval_loss
      - train.train_qlora_train_loss
      - train.train_qlora_steps
      - train.candidate_artifact_id
      - input.test_version
      # the eval leg (#42): whether it measured, how, and the deltas (candidate − base) with their
      # standard errors; every figure, with sample sizes, is in its results file (`results_uri`)
      - eval.eval_lm_eval_checked
      - eval.eval_lm_eval_note
      - eval.eval_lm_eval_preset
      - eval.eval_lm_eval_split_loss_method
      - eval.eval_lm_eval_base_val_loss
      - eval.eval_lm_eval_candidate_val_loss
      - eval.eval_lm_eval_base_test_loss
      - eval.eval_lm_eval_candidate_test_loss
      - eval.eval_lm_eval_worst_delta
      - eval.eval_lm_eval_worst_delta_metric
      - eval.eval_lm_eval_regressions
      - eval.eval_lm_eval_delta_arc_easy_acc
      - eval.eval_lm_eval_delta_arc_easy_acc_stderr
      - eval.eval_lm_eval_delta_arc_challenge_acc
      - eval.eval_lm_eval_delta_arc_challenge_acc_stderr
      - eval.eval_lm_eval_delta_hellaswag_acc
      - eval.eval_lm_eval_delta_hellaswag_acc_stderr
      - eval.eval_lm_eval_delta_winogrande_acc
      - eval.eval_lm_eval_delta_winogrande_acc_stderr
      - eval.eval_lm_eval_delta_piqa_acc
      - eval.eval_lm_eval_delta_piqa_acc_stderr
      - eval.eval_lm_eval_delta_mmlu_acc
      - eval.eval_lm_eval_delta_mmlu_acc_stderr
      - eval.eval_lm_eval_results_uri

  # ── tag the adapter (an operator-declared gate) ───────────────────────────
  - id: promote
    label: Tag the adapter
    task: artifact/promote
    depends_on: [promote-model]
    with:
      tag: $input.tag
      artifact_id: $steps.train.candidate_artifact_id
      reason: "validation loss below the base model's, and a person approved"

  # ── the backstop: stop the box on every outcome (ADR-0097, ADR-0151 D9/D11) ──
  # Wired from `$input`, never from `$steps.acquire`, so it resolves even when acquire never
  # ran. Under CAIRN_RUNTIME=temporal a plan with a finalizer is refused at launch (D10).
  - id: release
    label: Stop the GPU box (finally)
    task: compute/release
    finalizer: true
    with:
      connection: $input.compute_connection

outputs:
  adapter: train.candidate_artifact_id
  adapter_uri: train.train_qlora_adapter_uri
  baseline_eval_loss: train.train_qlora_baseline_eval_loss
  eval_loss: train.train_qlora_eval_loss
  train_loss: train.train_qlora_train_loss
  evaluated: eval.eval_lm_eval_checked
  eval_results: eval.eval_lm_eval_results_uri
  test_loss_base: eval.eval_lm_eval_base_test_loss
  test_loss: eval.eval_lm_eval_candidate_test_loss
  promoted: promote.artifact_id
