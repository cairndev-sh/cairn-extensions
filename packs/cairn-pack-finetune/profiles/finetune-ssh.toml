# profiles/finetune-ssh.toml — run the `sft` pipeline's ml legs on an ssh GPU box
# (cairn-extensions#7).
#
#     export GPU_SSH_KEY="$(cat ~/.ssh/id_ed25519)"     # in the engine's environment
#     cairn connect add ssh --name gpu --set host=<box> --set user=<user> \
#         --set known_hosts=$HOME/.ssh/known_hosts --secret PRIVATE_KEY=GPU_SSH_KEY
#     export CAIRN_PROFILE=<this file>
#
# The box installs `cairn-operator-training[gpu]` (torch, unsloth, trl, peft, transformers,
# bitsandbytes, pinned); the control plane installs `cairn-pack-finetune` only.
#
# Two machines need a store both can reach, so this profile selects the s3 artifact store: the
# versions dataset-prep registers, and the adapter (`artifact_target: s3`), cross through it.
# The environment names the buckets — CAIRN_ARTIFACT_S3_BUCKET (registered files) and
# CAIRN_CHECKPOINT_BUCKET (checkpoints and the adapter) — and MLFLOW_TRACKING_URI turns on
# `report_to: [mlflow]`. Running everything on one machine needs none of this: use the default
# profile, and the local store.

[profile]
visibility = "public"

[profile.backends]
dataflow_engine = "builtin"   # dataset-prep/prepare's data leg, on the control plane's box
ml_engine       = "builtin"   # the sft-train flow, dispatched to ml_target
ml_target       = "gpu"       # the compute.ssh connection named `gpu`
artifact_store  = "s3"        # the versions and registered files cross machines through S3
