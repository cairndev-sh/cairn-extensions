# docs/policies/laptop/promote-needs-approval.yaml — tagging an adapter as the candidate needs a person.
#
# Keyed on the capability `artifact.promote` (what the `artifact/promote` operator provides), not on
# a pipeline leg: wherever the tag would move, in any pipeline, a person approves first. The
# `promote-model` gate in `finetune/sft-local` is where that person sees the held-out losses; this
# policy is the environment's guarantee that the tag itself never moves without one.
name: laptop-promote-needs-approval
description: Moving a governed tag onto an artifact waits for a person.

applies_to:
  capabilities:
    - artifact.promote

rules:
  - effect: require_hitl
    reason: "a promoted adapter is the one people will use; a person approves the tag"
    approval_role: ml-owners
