# cairn-pack-finetune — the finetune domain pack as a data wheel (cairn-extensions#7).
#
# Discovered through the `cairn.packs` entry point declared here: `pip install
# cairn-pack-finetune` is all the engine needs. The wheel carries this directory under the
# import name `cairn_pack_finetune`: the manifest, the one-line shim the entry point
# targets, and the declarative assets. No operator; the stages the flows name come from
# cairn-operator-training (`sft-train`) and cairn-operator-eval-lm (`sft-eval`). The control plane
# needs no torch: the GPU box installs `cairn-operator-training[gpu]` and
# `cairn-operator-eval-lm[box]`. In a checkout, `CAIRN_PACK_PATH=packs/cairn-pack-finetune`
# loads the same directory as a dev pack.
[project]
name = "cairn-pack-finetune"
version = "0.2.1"
description = "cairn domain pack: fine-tune a model with LoRA or QLoRA on prepared train, val and test versions."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "cairn maintainers"}]
dependencies = [
    "cairndev>=0.3.1,<0.4",
    # The kernels the flow names (sample.fidelity, train.qlora 1.2.0, eval.checkpoints,
    # package.adapter); the base install carries no training stack.
    "cairn-operator-training>=0.1,<0.2",
    # The kernel the `sft-eval` flow names (eval.lm_eval, cairn-extensions#42): the control plane
    # checks a flow's stages against its registry at launch; the box needs the `[box]` extra.
    "cairn-operator-eval-lm>=0.2,<0.3",
    # compute/acquire and compute/release (cairndev's remote pack) start and stop the `sft` box
    # through boto3 on the control plane; cairndev declares it only in an extra (#26).
    "boto3>=1.34",
]

[project.optional-dependencies]
# test — what the pack's own tests import beyond pytest; CI installs it (scripts/test_wheels.sh).
# moto: a fake S3 for the checkpoint bucket a retried leg resumes from (#28).
test = ["moto[s3]>=5"]

[project.urls]
Homepage = "https://cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn-extensions"
Issues = "https://github.com/cairndev-sh/cairn-extensions/issues"

[project.entry-points."cairn.packs"]
finetune = "cairn_pack_finetune:pack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "cairn_pack_finetune/__init__.py"
"pack.toml" = "cairn_pack_finetune/pack.toml"
"pipelines" = "cairn_pack_finetune/pipelines"
"flows" = "cairn_pack_finetune/flows"
"presets" = "cairn_pack_finetune/presets"
"profiles" = "cairn_pack_finetune/profiles"
"docs" = "cairn_pack_finetune/docs"   # the example policy: data, never loaded by the pack

[tool.hatch.build.targets.sdist]
include = ["__init__.py", "pack.toml", "pipelines", "flows", "presets", "profiles", "docs", "tests", "README.md",
           "LICENSE", "NOTICE", "pyproject.toml"]
