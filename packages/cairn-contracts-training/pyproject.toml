# Shared contracts for the training capability domain (#210, ADR-0111): DATA ONLY — no Python
# package, no entry points. The wheel carries `cairn_contracts/cairn-contracts-training/` (descriptor + capabilities +
# schemas), which `cairn.core.pack.contracts.resolve_contracts` discovers from installed metadata.
# The root installs it NON-editable (`{ workspace = true, editable = false }`).
[project]
name = "cairn-contracts-training"
version = "1.0.0"
description = "Shared contract definitions for the training capability domain (train.run, train.teardown)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = { text = "Apache-2.0" }
# The core's contract resolver admits only cairn_contracts/<name>/ and files directly in
# *.dist-info/ (a data-only wheel); a license file would land in *.dist-info/licenses/.
# LICENSE and NOTICE stay in this directory and the sdist.
license-files = []
authors = [{name = "cairn maintainers"}]

[project.urls]
Homepage = "https://cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn-extensions"
Issues = "https://github.com/cairndev-sh/cairn-extensions/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"definitions" = "cairn_contracts/cairn-contracts-training"
