# Shared contracts for the dataset capability domain (#2242 V1-B, ADR-0111): DATA ONLY — no Python
# package, no entry points. The wheel carries `cairn_contracts/cairn-contracts-dataset/` (descriptor +
# capabilities + schemas), which `cairn.core.pack.contracts.resolve_contracts` discovers from installed
# metadata. The root installs it NON-editable (`{ workspace = true, editable = false }`): an editable
# install is refused as not data-only.
[project]
name = "cairn-contracts-dataset"
version = "1.2.0"
description = "Shared contract definitions for the dataset capability domain (dataset.decontam, dataset.provenance, dataset.sample, dataset.gate; 1.1.0 adds dataset.publish_fingerprints, dataset.anonymize, dataset.split, dataset.pii_scan, dataset.prep_gate, dataset.prep_review)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = { text = "Apache-2.0" }
# The core's contract resolver admits only cairn_contracts/<name>/ and files directly in
# *.dist-info/ (a data-only wheel); a license file would land in *.dist-info/licenses/.
# LICENSE and NOTICE stay in this directory and the sdist.
license-files = []
authors = [{name = "cairn maintainers"}]

[project.urls]
Homepage = "https://cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn-extensions"
Issues = "https://github.com/cairndev-sh/cairn-extensions/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"definitions" = "cairn_contracts/cairn-contracts-dataset"
