# LLM-judge quality selection (#384): scores each example via the governed LLM
# gateway (AlpaGasus / DEITA) and writes a curated dataset. Calls a paid model —
# risk paid_compute; writes a new dataset file.
[operator."dataset/curate"]
version       = "0.1.0"
input_schema  = "CurateInput"
output_schema = "CurateOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "paid_compute"
executors = ["in_process"]

[operator."dataset/curate".capabilities]
provides = ["dataset.curate"]

# Deterministic, group-aware (+ optionally stratified) train/val[/test] split.
[operator."dataset/split"]
version       = "0.1.0"
implements    = ["contract://dataset.split/1.0.0"]
input_schema  = "SplitInput"
output_schema = "SplitOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "external_write"
executors = ["in_process"]

[operator."dataset/split".capabilities]
provides = ["dataset.split"]

# ADR-0095 §2.3 (#1625) — rehearsal sampling: mixes rows from prior cycles'
# governed dataset versions (#1466) into the new train slice at a governed
# ratio, recording which source each row-group came from. Anti-forgetting as a
# DATA operation (EWC/GEM stay rejected). external_write — it writes the mixed
# dataset the next train leg consumes.
[operator."dataset/replay"]
version       = "0.1.0"
implements    = ["contract://dataset.replay/1.0.0"]
input_schema  = "ReplayInput"
output_schema = "ReplayOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "external_write"
executors = ["in_process"]

[operator."dataset/replay".capabilities]
provides = ["dataset.replay"]

# ADR-0095 §1.2 (#1629) — the signal→rung projections. Pure operators over the
# EXPORTED capture JSONL (D4: no store access from an operator; the export is
# where the consent gate and the holdout split already ran). external_write —
# each writes the dataset its rung consumes.
[operator."dataset/capture_to_sft"]
version       = "0.1.0"
input_schema  = "CaptureToSftInput"
output_schema = "CaptureToSftOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "external_write"
executors = ["in_process"]

[operator."dataset/capture_to_sft".capabilities]
provides = ["dataset.capture_to_sft"]

[operator."dataset/capture_to_pairs"]
version       = "0.1.0"
input_schema  = "CaptureToPairsInput"
output_schema = "CaptureToPairsOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "external_write"
executors = ["in_process"]

[operator."dataset/capture_to_pairs".capabilities]
provides = ["dataset.capture_to_pairs"]

# NOT (prompt, completion, score) triples — GRPO scores its OWN rollouts, so a
# captured score is context for a reward function, never a training reward. See
# the operator docstring.
[operator."dataset/capture_to_rewards"]
version       = "0.1.0"
input_schema  = "CaptureToRewardsInput"
output_schema = "CaptureToRewardsOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "external_write"
executors = ["in_process"]

[operator."dataset/capture_to_rewards".capabilities]
provides = ["dataset.capture_to_rewards"]


# ─── dataset/publish_fingerprints ─────────────────────────────────────
#
# #1050 — the CONTROL-SIDE half of cross-batch dedup (ADR-0080 P2). `probe` asks
# "seen these row hashes in an earlier batch?"; this publishes the index a future
# probe reads. It cannot be a dataflow stage: the data plane's job box has no
# database access (the gap found live), so the write happens control-side after
# the engine returns the cleaned output.
#
# risk = read_only: it writes cairn's OWN index — no user data, no external
# system, nothing to gate. Never raises; a missing store degrades to
# published=0 + a `skipped` reason so losing the index cannot fail a run whose
# remediation already succeeded.

[operator."dataset/publish_fingerprints"]
version       = "0.1.0"
implements    = ["contract://dataset.publish_fingerprints/1.0.0"]
input_schema  = "PublishFingerprintsInput"
output_schema = "PublishFingerprintsOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/publish_fingerprints".capabilities]
provides = ["dataset.publish_fingerprints"]
