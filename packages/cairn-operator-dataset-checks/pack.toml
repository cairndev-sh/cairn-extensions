# cairn-operator-dataset-checks — declarative manifest.
# Dataset readiness: the `dataset/*` operations check a corpus (format, exact and near
# duplicates, contamination against eval sets, PII, token profile, provenance) and, under a
# gate, fix what they found (dedup/decontam apply, anonymize, a leakage-resistant split); the
# `cairn.dataflow_stages` kernels are the same logic as the admission and cleaning chain an
# engine runs. Every heavy dependency is an extra with an honest fallback. Schema:
# cairn.core.pack.manifest.

[pack]
name        = "cairn-operator-dataset-checks"
version     = "0.1.0"
type        = "operator"
description = "Deterministic readiness checks for fine-tuning datasets (format, dedup, …)."
kind        = "operator"
publisher   = "cairn"
trust_level = "official"

[compat]
cairn_engine = ">=0.2.1,<0.4"

[operator."dataset/format"]
version       = "0.1.0"
input_schema  = "FormatInput"
output_schema = "FormatOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/format".capabilities]
provides = ["dataset.format_check"]

[operator."dataset/dedup"]
version       = "0.2.0"
input_schema  = "DedupInput"
output_schema = "DedupOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/dedup".capabilities]
provides = ["dataset.dedup"]

# #991 (ADR-0076 D3) — the REMEDIATION half of dataset/dedup: drops the duplicate
# rows the check flagged and writes a cleaned dataset. external_write (gated).
[operator."dataset/dedup_apply"]
version       = "0.1.0"
input_schema  = "DedupApplyInput"
output_schema = "DedupApplyOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "external_write"
executors = ["in_process"]

[operator."dataset/dedup_apply".capabilities]
provides = ["dataset.dedup_apply"]

[operator."dataset/pii_scan"]
version       = "0.1.0"
implements    = ["contract://dataset.pii_scan/1.0.0"]
input_schema  = "PiiInput"
output_schema = "PiiOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/pii_scan".capabilities]
provides = ["dataset.pii_scan"]

# ADR-0080 P1 (#1029) — the FUSED single-pass check: one streaming read emitting
# format + dedup + profile + PII findings (full-corpus secrets + sampled NER), so
# the readiness gate reads one data pass instead of four re-streams. Shardable tag
# routes it to the cairn-data fast-check queue; it runs inline (no fan-out).
[operator."dataset/scan_all"]
version       = "0.1.0"
input_schema  = "ScanAllInput"
output_schema = "ScanAllOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/scan_all".capabilities]
provides = ["dataset.scan_all"]

[operator."dataset/decontam"]
version       = "0.3.0"
implements    = ["contract://dataset.decontam/1.0.0"]
input_schema  = "DecontamInput"
output_schema = "DecontamOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/decontam".capabilities]
provides = ["dataset.decontam"]

# #991 (ADR-0076 D3) — the REMEDIATION half of dataset/decontam: drops the
# training rows that leak the eval set and writes a cleaned dataset. external_write.
[operator."dataset/decontam_apply"]
version       = "0.1.0"
input_schema  = "DecontamApplyInput"
output_schema = "DecontamApplyOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "external_write"
executors = ["in_process"]

[operator."dataset/decontam_apply".capabilities]
provides = ["dataset.decontam_apply"]

[operator."dataset/profile"]
version       = "0.2.0"
input_schema  = "ProfileInput"
output_schema = "ProfileOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/profile".capabilities]
provides = ["dataset.profile"]

[operator."dataset/provenance"]
version       = "0.1.0"
implements    = ["contract://dataset.provenance/1.0.0"]
input_schema  = "ProvenanceInput"
output_schema = "ProvenanceOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/provenance".capabilities]
provides = ["dataset.provenance"]

# Deterministic verdict: findings → pass/warn/fail with cited reasons. The
# engine gates here; the LLM synthesis step only narrates this output.
[operator."dataset/gate"]
version       = "0.1.0"
implements    = ["contract://dataset.gate/1.0.0"]
input_schema  = "GateInput"
output_schema = "GateOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/gate".capabilities]
provides = ["dataset.gate"]

# #882 — the config-gated POST-SCRUB PII gate. Deterministic: turns prep's own
# re-scan (post_scrub_pii_rows) + the env-owned `mode` knob into a verdict.
[operator."dataset/prep_gate"]
version       = "0.1.0"
implements    = ["contract://dataset.prep_gate/1.0.0"]
input_schema  = "PrepGateInput"
output_schema = "PrepGateOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = false
risk      = "read_only"
executors = ["in_process"]

[operator."dataset/prep_gate".capabilities]
provides = ["dataset.prep_gate"]

# #883 — HITL review of a dirty scrub. requires_approval=true → the durable
# approval gate fires BEFORE this runs (the prep run pauses awaiting_approval)
# when dataset/prep_gate routed here (mode=hitl AND residual PII).
[operator."dataset/prep_review"]
version       = "0.1.0"
implements    = ["contract://dataset.prep_review/1.0.0"]
input_schema  = "PrepReviewInput"
output_schema = "PrepReviewOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
risk             = "read_only"
requires_approval = true
executors = ["in_process"]

[operator."dataset/prep_review".capabilities]
provides = ["dataset.prep_review"]

# Deterministic (input, output) sampler that feeds the eval/judge soft signal.
[operator."dataset/sample"]
version       = "0.1.0"
implements    = ["contract://dataset.sample/1.0.0"]
input_schema  = "SampleInput"
output_schema = "SampleOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
